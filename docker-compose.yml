version: '3.8'

services:
  backend:
    container_name: api-backend
    build:
      context: ./API
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./API/uploads:/usr/src/app/uploads
      - ./API/logs:/usr/src/app/logs    
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql.railway.internal
      - DB_USER=root
      - DB_PASSWORD=ZNfNBEoudeyzZfebELvNIVZupBcvkMWB
      - DB_NAME=railway
      - JWT_SECRET=your_jwt_secret
      - DB_PORT=3306
      - PORT=3000

  frontend:
    container_name: web-frontend
    build:
      context: ./WEB
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-server
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - frontend
      - backend
    volumes:
      - ./API/uploads:/var/www/backend/uploads
      - ./API/logs:/var/www/backend/logs
      - ./certbot/www:/var/www/certbot/:ro
      - ./nginx-railway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt/:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot/:rw
      - ./certbot/conf:/etc/letsencrypt/:rw

  db:
    container_name: mysql-db
    image: mysql:9.4
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=ZNfNBEoudeyzZfebELvNIVZupBcvkMWB
      - MYSQL_DATABASE=railway
    volumes:
      - ./db_data:/var/lib/mysql

volumes:
  db_data:
